name: CI

# CI صادقانه: تایپ‌چک سخت + لینت + بیلد + سنسِ نسخه + چک پیکربندی دسکتاپ.
# تست‌های unit هنوز author نشده‌اند (docs/DEPENDENCIES.md) — به محض اضافه‌شدن، job جدا می‌گیرند.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, Lint, Build (web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Version consistency (VERSION / package.json / brand.ts)
        run: |
          V_FILE=$(tr -d ' \n' < VERSION)
          V_PKG=$(node -p "require('./package.json').version")
          echo "VERSION=$V_FILE package.json=$V_PKG"
          test "$V_FILE" = "$V_PKG" || { echo "نسخه‌ها هم‌خوان نیستند"; exit 1; }

      - name: Typecheck (strict)
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Build (standalone + copy static/public)
        run: bun run build

      - name: Verify standalone output
        run: test -f .next/standalone/server.js

  desktop-config:
    name: Tauri desktop config sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tauri config parse + Rust fmt check
        run: |
          python3 - <<'PY'
          import json
          c = json.load(open('src-tauri/tauri.conf.json'))
          assert c['bundle']['active'] is True
          assert 'nsis' in c['bundle']['targets'] and 'msi' in c['bundle']['targets']
          assert c['bundle']['externalBin'] == ['binaries/node']
          print('tauri.conf.json OK — version', c['version'])
          v = open('VERSION').read().strip()
          assert c['version'] == v, 'tauri.conf.json version != VERSION'
          print('sidecar architecture OK (node externalBin + server-dist resources)')
          PY
