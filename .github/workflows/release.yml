name: Release

# انتشار روی push تگ v*:
#   1) job web:      بیلد وب + بستهٔ CLI + SBOM + checksum → draft release
#   2) job windows:  بیلد نصب‌کنندهٔ دسکتاپ (Tauri v2 + Node sidecar) → NSIS/MSI به همان draft
#                    (دیگر continue-on-error نیست — شکستش شکست کل انتشار است)
#   3) job publish:  فقط وقتی «همهٔ» آرتیفکت‌های اجباری سالم باشند draft را منتشر می‌کند.
#                    اگر دسکتاپ شکست خورد، Release به‌صورت Draft می‌ماند و علت در خروجی گزارش می‌شود —
#                    هیچ نسخهٔ ناقصی هرگز به‌عنوان Stable منتشر نمی‌شود.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_SIDECAR_VERSION: "22.14.0"

jobs:
  web:
    name: Web build, SBOM, draft release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Read version + consistency gate
        id: version
        run: |
          V_FILE=$(tr -d '[:space:]' < VERSION)
          V_PKG=$(node -p "require('./package.json').version")
          V_TOML=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "VERSION=$V_FILE package.json=$V_PKG Cargo.toml=$V_TOML"
          if [ "$V_FILE" != "$V_PKG" ] || [ "$V_FILE" != "$V_TOML" ]; then
            echo "❌ نسخه‌ها هم‌خوان نیستند — انتشار متوقف شد"; exit 1
          fi
          if [ "v$V_FILE" != "${GITHUB_REF_NAME}" ]; then
            echo "❌ تگ (${GITHUB_REF_NAME}) با VERSION ($V_FILE) یکی نیست — انتشار متوقف شد"; exit 1
          fi
          echo "version=$V_FILE" >> "$GITHUB_OUTPUT"
          # نسخهٔ پیش‌انتشار: هر نسخهٔ دارای پسوند (-beta.1 و مانند آن) مطابق SemVer
          if [[ "$V_FILE" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Unit tests (release gate)
        run: bun test tests/

      - name: Typecheck + Lint (release gate)
        run: |
          bunx tsc --noEmit
          bun run lint

      - name: Build web (standalone)
        run: bun run build

      - name: Assemble web package
        run: |
          mkdir -p dist/web
          cp -r .next/standalone/. dist/web/
          cp -r .next/static dist/web/.next/static
          cp -r public dist/web/public
          tar -czf "dist/sanjabos-web-${{ steps.version.outputs.version }}-standalone.tar.gz" -C dist/web .

      - name: Package CLI (if present)
        run: |
          if [ -d cli ]; then
            tar -czf "dist/sanjab-cli-${{ steps.version.outputs.version }}.tar.gz" cli
          else
            echo "cli/ not present — honest skip"
          fi

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          artifact-name: SBOM.spdx.json
          upload-artifact: false

      - name: Third-party notices
        run: cp THIRD_PARTY_LICENSES.md dist/THIRD-PARTY-NOTICES.md 2>/dev/null || echo "no notices file"

      - name: Collect metadata
        run: cp VERSION dist/VERSION

      - name: Pre-checksums (all except SHA256SUMS)
        working-directory: dist
        run: sha256sum sanjabos-web-* sanjab-cli-* SBOM.spdx.json THIRD-PARTY-NOTICES.md VERSION 2>/dev/null | sort -k2 > SHA256SUMS.txt || sha256sum * > SHA256SUMS.txt

      - name: Create draft GitHub Release (web artifacts)
        uses: softprops/action-gh-release@v2
        with:
          name: SanjabOS ${{ steps.version.outputs.version }}
          draft: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/*
            SBOM.spdx.json

  windows:
    name: Windows desktop installer (Tauri v2) — mandatory
    runs-on: windows-latest
    needs: web
    # شکست این job یعنی انتشار Stable انجام نمی‌شود (به publish نگاه کن)
    outputs:
      ok: ${{ steps.status.outputs.ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Build web (standalone)
        run: bun run build

      - name: Assemble sidecar server-dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/server-dist | Out-Null
          Copy-Item -Recurse -Force .next/standalone/* src-tauri/server-dist/
          Copy-Item -Recurse -Force .next/static src-tauri/server-dist/.next/static
          Copy-Item -Recurse -Force public src-tauri/server-dist/public
          Get-ChildItem src-tauri/server-dist | Select-Object Name

      - name: Seed fresh desktop database (schema only — zero dev data)
        shell: pwsh
        env:
          DATABASE_URL: "file:./sanjabos.db"
        run: |
          bunx prisma db push --skip-generate
          Copy-Item prisma/sanjabos.db src-tauri/server-dist/sanjabos.db
          Write-Output "fresh desktop DB (schema-only) bundled into server-dist"

      - name: Download portable Node.exe (sidecar)
        shell: pwsh
        run: |
          $v = "${{ env.NODE_SIDECAR_VERSION }}"
          $url = "https://nodejs.org/dist/v$v/win-x64/node.exe"
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "src-tauri/binaries/node-x86_64-pc-windows-msvc.exe"
          $size = (Get-Item "src-tauri/binaries/node-x86_64-pc-windows-msvc.exe").Length / 1MB
          Write-Output "node.exe sidecar: $([math]::Round($size,1)) MB"

      - name: Generate Tauri icons
        run: bunx @tauri-apps/cli icon ./public/sanjab-icon.png -o src-tauri/icons

      - name: Build installers (NSIS + MSI) via tauri-action
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: bunx @tauri-apps/cli
          tagName: v${{ needs.web.outputs.version }}
          releaseName: SanjabOS ${{ needs.web.outputs.version }}
          releaseId: ""
          releaseDraft: true
          prerelease: ${{ needs.web.outputs.prerelease == 'true' }}
          includeUpdaterJson: false
          args: "--target x86_64-pc-windows-msvc"

      - name: Job status marker
        id: status
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.tauri.outcome }}" -eq "success") { "ok=true" | Out-File -Append $env:GITHUB_OUTPUT } else { "ok=false" | Out-File -Append $env:GITHUB_OUTPUT }

  publish:
    name: Publish only when every mandatory artifact passed
    runs-on: ubuntu-latest
    needs: [web, windows]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------ مسیر شکست: Draft می‌ماند و علت دقیق گزارش می‌شود ------
      - name: Keep draft + report reason (desktop build failed)
        if: needs.web.outputs.version == '' || needs.windows.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.web.outputs.version }}
          WEB_RESULT: ${{ needs.web.result }}
          WIN_RESULT: ${{ needs.windows.result }}
        run: |
          TAG="v${VERSION}"
          if [ -z "$VERSION" ]; then
            echo "::error::web job failed before reading VERSION — no draft was created."
            exit 1
          fi
          REASON="وب: ${WEB_RESULT} / ویندوز: ${WIN_RESULT}"
          echo "Release $TAG در حالت Draft ماند. وضعیت: $REASON"
          gh release edit "$TAG" --draft=true
          gh release edit "$TAG" --notes "$(gh release view "$TAG" --json body --jq .body)

          > ## ⚠️ این انتشار هنوز Draft است
          > ساخت نصب‌کنندهٔ دسکتاپ ویندوز در این تگ موفق نشد ($REASON).
          > طبق سیاست انتشار، هیچ نسخهٔ ناقصی به‌عنوان Stable منتشر نمی‌شود.
          > پس از رفع علت، یک تگ جدید ساخته شود؛ بازنشر همین تگ با آرتیفکت متفاوت ممنوع است."
          echo "::error::Stable publish blocked — desktop build failed ($REASON). Draft kept."
          exit 1

      # ------ مسیر موفق: راستی‌آزمایی آرتیفکت‌ها و سپس انتشار ------
      - name: Verify mandatory assets exist on draft
        if: needs.web.outputs.version != '' && needs.windows.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.web.outputs.version }}
        run: |
          TAG="v${VERSION}"
          gh release view "$TAG" --json assets --jq '.assets[].name' > assets.txt
          cat assets.txt
          ok=1
          grep -qi 'sanjabos-web-.*standalone.tar.gz' assets.txt || { echo "::error::بستهٔ وب یافت نشد"; ok=0; }
          grep -qi '\.exe$' assets.txt || { echo "::error::نصاب exe ویندوز یافت نشد"; ok=0; }
          grep -qi '\.msi$' assets.txt || { echo "::error::نصاب msi ویندوز یافت نشد"; ok=0; }
          grep -qi 'SBOM' assets.txt || { echo "::error::SBOM یافت نشد"; ok=0; }
          [ "$ok" = "1" ] || { echo "::error::آرتیفکت‌های اجباری ناقص‌اند — انتشار متوقف شد (Draft می‌ماند)"; exit 1; }

      - name: Final checksums (installers included)
        if: needs.web.outputs.version != '' && needs.windows.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.web.outputs.version }}
        run: |
          TAG="v${VERSION}"
          gh release download "$TAG" --pattern "SHA256SUMS.txt" --clobber
          gh release download "$TAG" --pattern "SanjabOS_*" --clobber
          sha256sum SanjabOS_* >> SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber

      - name: Publish draft release
        if: needs.web.outputs.version != '' && needs.windows.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.web.outputs.version }}
        run: |
          TAG="v${VERSION}"
          gh release edit "$TAG" --draft=false
          echo "✅ Release $TAG published"
