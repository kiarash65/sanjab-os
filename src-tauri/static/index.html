<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>SanjabOS — در حال راه‌اندازی…</title>
    <style>
      body { background: #0b0b12; color: #f7931e; font-family: sans-serif; display: grid; place-items: center; height: 100vh; margin: 0; }
      .box { text-align: center; }
      .bar { width: 220px; height: 6px; background: #26262e; border-radius: 3px; overflow: hidden; margin: 14px auto; }
      .bar span { display: block; height: 100%; width: 40%; background: #f7931e; border-radius: 3px; animation: slide 1.1s infinite; }
      @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>سان‌جاب‌اواس</h2>
      <div class="bar"><span></span></div>
      <p>در حال راه‌اندازی سرور محلی… اگر این صفحه ماندید، فایروال پورت محلی را بسته است.</p>
    </div>
  </body>
</html>
