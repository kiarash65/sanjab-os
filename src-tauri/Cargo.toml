[package]
name = "sanjabos"
version = "4.0.0"
description = "SanjabOS — Persian educational WebOS desktop (SunJob edition)"
authors = ["kiarash65"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "sanjabos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
